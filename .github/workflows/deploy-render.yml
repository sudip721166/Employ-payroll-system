name: CI & Deploy to Render

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Build backend Docker image (optional)
        run: |
          docker build -t payroll-backend:${{ github.sha }} -f Dockerfile.backend backend

      - name: Install jq (for parsing JSON)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e
          echo "Triggering deploy for Render service $RENDER_SERVICE_ID"
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{"clearCache":false}')
          echo "Render response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Failed to start deploy. Response:" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi
          echo "Started deploy: $DEPLOY_ID"

          # Poll deploy status (up to ~5 minutes)
          for i in {1..30}; do
            STATUS=$(curl -s "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.state')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "succeeded" ]; then
              echo "Deploy succeeded"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "Deploy failed" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy to finish" >&2
          exit 1
